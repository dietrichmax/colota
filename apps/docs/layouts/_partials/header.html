{{- $section := .Section }}
<header class="hdr">
  <a class="brand" href="/"><img src="/img/app-icon.png" alt="" width="28" height="28" />Colota</a>
  <nav class="hdr-nav" aria-label="Main">
    <a href="/docs/"{{ if eq $section "docs" }} class="on" aria-current="page"{{ end }}>Docs</a>
    <a href="/releases/"{{ if eq .RelPermalink "/releases/" }} class="on" aria-current="page"{{ end }}>Releases</a>
  </nav>
  <div class="hdr-tools">
    <a class="hdr-github" href="{{ hugo.Data.links.REPO_URL }}">GitHub{{ partial "icon.html" (dict "name" "external-link" "class" "sm") }}</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch between light and dark theme">
      {{- partial "icon.html" (dict "name" "sun" "class" "theme-sun") }}{{ partial "icon.html" (dict "name" "moon" "class" "theme-moon") -}}
    </button>
  </div>
</header>
