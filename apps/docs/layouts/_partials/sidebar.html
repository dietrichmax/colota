{{- $current := .RelPermalink }}
{{- $groups := index (partialCached "docs-order.html" .) (partial "sidebar-name.html" .) }}
<nav class="side" aria-label="Docs">
  {{- range $groups }}
    <div class="side-group">
      <p class="side-label">{{ .label }}</p>
      {{- range .pages }}
        <a class="side-item{{ if eq .RelPermalink $current }} on{{ end }}" href="{{ .RelPermalink }}"{{ if eq .RelPermalink $current }} aria-current="page"{{ end }}>{{ .Title }}</a>
      {{- end }}
    </div>
  {{- end }}
</nav>
