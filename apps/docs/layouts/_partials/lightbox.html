<dialog class="lightbox" data-lightbox aria-label="Screenshot">
  <img alt="" data-lightbox-img />
  <p class="lightbox-caption"><span data-lightbox-label></span> <span class="lightbox-count" data-lightbox-count></span></p>
  <button class="icon-btn lightbox-prev" type="button" data-lightbox-prev aria-label="Previous">{{ partial "icon.html" (dict "name" "chevron-left") }}</button>
  <button class="icon-btn lightbox-next" type="button" data-lightbox-next aria-label="Next">{{ partial "icon.html" (dict "name" "chevron-right") }}</button>
  <button class="icon-btn lightbox-close" type="button" data-lightbox-close aria-label="Close">{{ partial "icon.html" (dict "name" "x") }}</button>
</dialog>
