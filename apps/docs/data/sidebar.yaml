# The two sidebars, in order. Each page is its path under docs/ without .md. A page in neither, or a listed page
# that does not exist, fails the build. Docs groups follow the app's areas, not the folders.
docs:
  - label: Getting started
    pages: [introduction, getting-started/quick-start]
  - label: Tracking
    pages:
      - configuration/tracking-sync
      - guides/tracking-profiles
      - guides/geofencing
      - guides/automation
      - guides/battery-optimization
  - label: Connection
    pages: [configuration/connection, configuration/request-format, configuration/authentication, configuration/mtls]
  - label: History and data
    pages:
      - guides/location-history
      - guides/editing-trips
      - guides/data-export
      - guides/data-import
      - guides/data-management
      - guides/backup-restore
      - guides/deep-link-setup
  - label: Display
    pages: [configuration/appearance, guides/offline-maps, guides/tile-server]
  - label: Help
    pages: [guides/troubleshooting, faq]
  - label: Reference
    pages: [api-reference, development/permissions, security, alternatives]
  - label: Development
    pages:
      - development/architecture
      - development/local-setup
      - getting-started/build-from-source
      - development/translations
      - contributing
integrations:
  - label: Start here
    pages: [integrations/overview]
  - label: Servers
    pages:
      - integrations/dawarich
      - integrations/geopulse
      - integrations/home-assistant
      - integrations/overland
      - integrations/owntracks
      - integrations/phonetrack
      - integrations/reitti
      - integrations/traccar
  - label: Your own
    pages: [integrations/custom-backend]
  - label: Several backends
    pages: [integrations/forwarder, integrations/forwarder-reference]
