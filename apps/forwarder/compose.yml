services:
  colota-forwarder:
    image: mxdcodes/colota-forwarder:v0.4.10@sha256:1f3e846cf0771c27c752edb10113100931e4b72a6613fc509e70ee7efbd44556
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.5"
