appId: com.Colota
---
- launchApp
- setLocation:
    latitude: ${START_LAT}
    longitude: ${START_LON}
- extendedWaitUntil:
    visible: "Got it"
    timeout: 60000

- openLink: ${SETUP_LINK}
- extendedWaitUntil:
    visible: "Apply configuration"
    timeout: 30000
- takeScreenshot: SetupImport
- scrollUntilVisible:
    element:
      text: "Apply configuration"
- tapOn: "Apply configuration"
- tapOn: "OK"

- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "nav-appearance"
- tapOn:
    id: "nav-appearance"
- tapOn:
    id: "unit-metric"
- takeScreenshot: AppearanceSettings
- back
- tapOn: "Dashboard"

- extendedWaitUntil:
    visible: "Start tracking"
    timeout: 30000
- tapOn: "Start tracking"
- travel:
    points:
      - ${TRAVEL_1}
      - ${TRAVEL_2}
      - ${TRAVEL_3}
      - ${TRAVEL_4}
      - ${TRAVEL_5}
      - ${TRAVEL_6}
      - ${TRAVEL_7}
      - ${TRAVEL_8}
      - ${TRAVEL_9}
      - ${TRAVEL_10}
      - ${TRAVEL_11}
      - ${TRAVEL_12}
    speed: 12
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "nav-data-management"
- tapOn:
    id: "nav-data-management"
- tapOn:
    id: "sync-now-row"
- extendedWaitUntil:
    visible: "Sent .*"
    timeout: 60000
- takeScreenshot: DataManagement
- back
- tapOn: "Dashboard"
- extendedWaitUntil:
    notVisible: ".*queued.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: Dashboard

- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "nav-connection"
    direction: UP
- tapOn:
    id: "nav-connection"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ConnectionSettings
- scrollUntilVisible:
    element:
      id: "nav-request-format"
- tapOn:
    id: "nav-request-format"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ApiFieldMapping
- scrollUntilVisible:
    element:
      id: "nav-backend-template"
- tapOn:
    id: "nav-backend-template"
- extendedWaitUntil:
    visible: "Traccar"
    timeout: 10000
- takeScreenshot: BackendTemplates
- back
- back
- scrollUntilVisible:
    element:
      id: "nav-auth-settings"
- tapOn:
    id: "nav-auth-settings"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: Authentication
- back
- scrollUntilVisible:
    element:
      id: "nav-mtls-settings"
- tapOn:
    id: "nav-mtls-settings"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: MtlsSettings
- back
- back

- tapOn:
    id: "nav-tracking-sync"
- tapOn:
    id: "preset-balanced"
- extendedWaitUntil:
    notVisible: "Tracking restarted|Saving.*"
    timeout: 15000
- takeScreenshot: SyncPresets
- tapOn:
    id: "preset-custom"
- scrollUntilVisible:
    element:
      text: "Movement threshold"
- extendedWaitUntil:
    notVisible: "Tracking restarted|Saving.*"
    timeout: 15000
- takeScreenshot: TrackingSettings
- scrollUntilVisible:
    element:
      id: "preset-balanced"
    direction: UP
- tapOn:
    id: "preset-balanced"
- back

- tapOn:
    id: "nav-tracking-profiles"
- extendedWaitUntil:
    visible: "Driving"
    timeout: 10000
- takeScreenshot: TrackingProfiles
- tapOn: "Driving"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ProfileEditor
- back
- back

- scrollUntilVisible:
    element:
      id: "nav-offline-maps"
- tapOn:
    id: "nav-offline-maps"
- tapOn:
    id: "area-name-input"
- inputText: ${AREA_NAME}
- hideKeyboard
- extendedWaitUntil:
    visible: ".*estimated.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: OfflineMaps
- back

- scrollUntilVisible:
    element:
      id: "nav-export-import"
- tapOn:
    id: "nav-export-import"
- extendedWaitUntil:
    visible:
      id: "stat-locations"
    timeout: 10000
- takeScreenshot: ExportData
- tapOn:
    id: "nav-auto-export"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: AutoExport
- back
- tapOn:
    id: "import-file-row"
- runFlow:
    when:
      notVisible: "colota-demo-timeline.json"
    commands:
      - tapOn: "Show roots"
      - tapOn: "Downloads"
- tapOn: "colota-demo-timeline.json"
- extendedWaitUntil:
    visible:
      id: "preview-state"
    timeout: 30000
- takeScreenshot: Import
- scrollUntilVisible:
    element:
      id: "import-commit-btn"
- tapOn:
    id: "import-commit-btn"
- tapOn:
    text: "Import"
    below:
      text: "Nothing already stored.*"
- extendedWaitUntil:
    visible: "Imported .*"
    timeout: 60000
- back

- tapOn: "History"
- tapOn:
    id: "day-previous"
- extendedWaitUntil:
    visible:
      id: "dock-legend"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: LocationHistory
- tapOn: "Trips"
- extendedWaitUntil:
    visible:
      id: "trip-row-.*"
    timeout: 10000
- takeScreenshot: Trips
- longPressOn:
    id: "trip-row-.*"
    index: 0
- tapOn:
    id: "trip-row-.*"
    index: 1
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: MergeTrips
- tapOn:
    id: "exit-selection-btn"
- tapOn:
    id: "trip-row-.*"
    index: 0
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: TripDetails
- tapOn:
    point: "${SPLIT_POINT}"
- extendedWaitUntil:
    visible:
      id: "point-split"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: SplitTrip
- tapOn:
    id: "point-close"
- back

- tapOn: "Geofences"
- extendedWaitUntil:
    visible: "Home"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: Geofences
- tapOn:
    id: "edit-geofence-.*"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: GeofenceEditor
- back

- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "nav-connection"
    direction: UP
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: Settings
- scrollUntilVisible:
    element:
      id: "nav-share-setup"
- tapOn:
    id: "nav-share-setup"
- tapOn:
    id: "share-api"
- tapOn:
    id: "share-geofences"
- tapOn:
    id: "share-profiles"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ShareSetup
- back
- scrollUntilVisible:
    element:
      id: "nav-logging"
- tapOn:
    id: "nav-logging"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: Logging
- back

- scrollUntilVisible:
    element:
      id: "nav-appearance"
    direction: UP
- tapOn:
    id: "nav-appearance"
- tapOn:
    id: "theme-dark"
- back
- scrollUntilVisible:
    element:
      id: "nav-backup-restore"
- tapOn:
    id: "nav-backup-restore"
- tapOn:
    id: "backup-password"
- inputText: "glacier-lantern-orbit-73"
- tapOn:
    id: "backup-password-confirm"
- inputText: "glacier-lantern-orbit-73"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: Backup
- back
- tapOn: "Dashboard"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: DarkMode
