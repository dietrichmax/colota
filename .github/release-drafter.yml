name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

exclude-labels:
  - skip-changelog

version-resolver:
  major:
    labels: [major, breaking]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [fix, bug, maintenance, refactor, documentation, dependencies]
  default: patch

autolabeler:
  - label: skip-changelog
    title: ['/^chore\(release\):/i']
  - label: breaking
    title: ['/^\w+(\(.+\))?!:/i']
  - label: dependencies
    title: ['/^(chore|fix|build)\(deps\)/i']
  - label: feature
    title: ['/^feat(\(.+\))?!?:/i']
  - label: fix
    title: ['/^fix(\((?!deps\))[^)]*\))?!?:/i']
  - label: documentation
    title: ['/^docs(\(.+\))?:/i']
  - label: refactor
    title: ['/^(refactor|perf)(\(.+\))?!?:/i']
  - label: maintenance
    title: ['/^(chore|style|ci|build|test)(\((?!deps\))[^)]*\))?!?:/i']

categories:
  - title: 'Breaking Changes'
    labels: [breaking, major]
  - title: "What's New"
    labels: [feature, enhancement]
  - title: 'Fixes'
    labels: [fix, bug]
  - title: 'Improvements'
    labels: [refactor]
    collapse-after: 3
  - title: 'Maintenance'
    labels: [maintenance]
    collapse-after: 8
  - title: 'Documentation'
    labels: [documentation]
    collapse-after: 2
  - title: 'Dependencies'
    labels: [dependencies]
    collapse-after: 1
  - title: 'Other'
    labels: ['*']

change-template: '- $TITLE (#$NUMBER)'
no-changes-template: '- No changes'
category-template: '### $TITLE'

template: |
  ## Which APK should I download?

  Pick the build that matches your device:

  - **arm64-v8a** - almost every phone from the last several years (recommended)
  - **armeabi-v7a** - older 32-bit devices
  - **universal** - one larger APK that runs on any device, if you are unsure

  Each comes in two flavors: **gms** uses Google Play Services for location, **foss** uses Android's own LocationManager and needs no Google services.

  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/dietrichmax/colota/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
