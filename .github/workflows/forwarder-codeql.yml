name: Forwarder CodeQL

on:
  push:
    branches: [main]
    paths:
      - "apps/forwarder/**"
      - ".github/workflows/forwarder-codeql.yml"
      - ".github/forwarder-codeql-config.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/forwarder/**"
      - ".github/workflows/forwarder-codeql.yml"
      - ".github/forwarder-codeql-config.yml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config-file: ./.github/forwarder-codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: "/language:javascript-typescript/forwarder"
