name: Docs Check
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/shared/**'
      - 'apps/mobile/src/i18n/locales/en.json'
      - 'screenshots/demo-track.gpx'
      - '.nvmrc'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Test docs scripts
        run: npm test -w @colota/docs

      - name: Build docs
        run: npm run build -w @colota/docs
