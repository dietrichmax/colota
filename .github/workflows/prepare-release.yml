name: Update Release Draft

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  autolabel:
    name: Label pull request
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.repo.full_name == 'dietrichmax/colota'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Apply labels
        uses: release-drafter/release-drafter/autolabeler@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7
        with:
          config-name: release-drafter.yml

  update_release_draft:
    name: Update release draft
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read release summary
        id: summary
        run: |
          f=$(ls fastlane/metadata/android/en-US/changelogs/*.txt 2>/dev/null | sort -V | tail -1)
          {
            echo 'text<<COLOTA_EOF'
            if [ -s "$f" ]; then cat "$f"; else echo '_Not written yet._'; fi
            echo 'COLOTA_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update Release Draft
        uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7
        with:
          config-name: release-drafter.yml
          header: |+
            ## Highlights

            ${{ steps.summary.outputs.text }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}